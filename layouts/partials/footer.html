<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-logo">
      <img src="{{ "images/rhoadesandsonlogo.png" | relURL }}" alt="Rhoades &amp; Son Home Inspections" class="footer-logo-img">
    </div>
    <div class="footer-nachi">
      <a href="https://www.nachi.org/verify?nachiid=NACHI26041441" target="_blank" rel="noopener">
        <img src="https://www.nachi.org/webseals/sb-v2-NACHI26041441.gif" width="98" height="102" alt="Certified by the International Association of Certified Home Inspectors" class="nachi-seal">
      </a>
    </div>
    <div class="footer-info">
      <a href="tel:{{ .Site.Params.phone }}">{{ .Site.Params.phone }}</a>
      <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
      <span>{{ .Site.Params.address }}</span>
      <span class="footer-copy">&copy; {{ now.Year }} {{ .Site.Title }}</span>
    </div>
  </div>
</footer>
